name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Prepare test environment
        run: |
          cat > .env <<'EOF'
          NODE_ENV=test
          WEB_ORIGIN=http://localhost:3000
          API_ORIGIN=http://localhost:4000
          PUBLIC_API_ORIGIN=http://localhost:4000
          SESSION_SECRET=ci_session_secret_at_least_16_chars
          ENCRYPTION_KEY=ci_encryption_key_at_least_32_chars_0123456789
          MONGODB_URI=mongodb://127.0.0.1:27017/payflow_ci
          EMAIL_PROVIDER_API_KEY=re_ci_test_key
          EMAIL_FROM=onboarding@payflow.test
          EMAIL_INTERCEPT_URL=http://127.0.0.1:8098
          SUBSCRIPTION_SANDBOX=true
          ADMIN_EMAILS=admin@payflow.test
          NEXT_PUBLIC_API_ORIGIN=http://localhost:4000
          NEXT_PUBLIC_APP_NAME=PayFlow
          RAZORPAY_KEY_ID=rzp_test_ci_key_id
          RAZORPAY_KEY_SECRET=rzp_test_ci_key_secret
          RAZORPAY_WEBHOOK_SECRET=ci_webhook_secret_at_least_16_chars
          EOF
      - name: Typecheck (all workspaces)
        run: npm run typecheck --workspaces --if-present
      - name: Lint
        run: |
          npm run lint -w apps/api
          npm run lint -w apps/web
      - name: Test
        run: npm test -w apps/api
      - name: Build web
        run: npm run build -w apps/web
      - name: Build API
        run: npm run build -w apps/api
      - name: Ensure mongod binary
        run: |
          if command -v mongod >/dev/null 2>&1; then
            echo "mongod is available on PATH"
          else
            sudo apt-get update
            sudo apt-get install -y gnupg curl
            curl -fsSL https://www.mongodb.org/static/pgp/server-7.0.asc | sudo gpg --dearmor -o /usr/share/keyrings/mongodb-server-7.0.gpg
            echo "deb [ arch=amd64,arm64 signed-by=/usr/share/keyrings/mongodb-server-7.0.gpg ] https://repo.mongodb.org/apt/ubuntu $(lsb_release -cs)/mongodb-org/7.0 multiverse" | sudo tee /etc/apt/sources.list.d/mongodb-org-7.0.list
            sudo apt-get update
            sudo apt-get install -y mongodb-org-server
          fi
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: E2E tests
        run: npm run test:e2e -w apps/web
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
