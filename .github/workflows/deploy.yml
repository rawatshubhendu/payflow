name: Deploy

# Deploys to Render after CI passes on main.
# Requires GitHub secrets:
#   RENDER_DEPLOY_HOOK_API - Render deploy hook URL for the payflow-api service
#   RENDER_DEPLOY_HOOK_WEB - Render deploy hook URL for the payflow-web service
#
# Find the hook URLs in Render dashboard under each service:
# Settings -> Deploy Hook. They are unique per service.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy (API)
        env:
          HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_API }}
        run: |
          if [ -z "$HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_API secret not set; skipping API deploy."
            exit 0
          fi
          curl -fsS -X POST "$HOOK_URL"

      - name: Trigger Render deploy (Web)
        env:
          HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_WEB }}
        run: |
          if [ -z "$HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_WEB secret not set; skipping web deploy."
            exit 0
          fi
          curl -fsS -X POST "$HOOK_URL"