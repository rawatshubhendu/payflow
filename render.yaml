# Render blueprint (blueprint.render.com / deploy via GitHub -> Render)
# Root monorepo; both services share the same repo. Set secrets via the Render dashboard.
#
# Required secrets (set in Render dashboard when prompted - never commit secrets):
#   MONGODB_URI, SESSION_SECRET, ENCRYPTION_KEY, EMAIL_PROVIDER_API_KEY
#   RAZORPAY_KEY_ID, RAZORPAY_KEY_SECRET, RAZORPAY_WEBHOOK_SECRET
#   ADMIN_EMAILS, SUBSCRIPTION_SANDBOX
#
# Service URLs are wired automatically via Render's RENDER_EXTERNAL_URL var,
# so nothing here needs a hardcoded hostname.

services:
  - type: web
    name: payflow-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm ci && npm run build -w apps/api
    startCommand: npm run start -w apps/api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: WEB_ORIGIN
        fromService:
          name: payflow-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: API_ORIGIN
        fromService:
          name: payflow-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: PUBLIC_API_ORIGIN
        fromService:
          name: payflow-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: MONGODB_URI
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: EMAIL_PROVIDER_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: SUBSCRIPTION_SANDBOX
        sync: false

  - type: web
    name: payflow-web
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm ci && npm run build -w apps/web
    startCommand: npm run start -w apps/web
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_ORIGIN
        fromService:
          name: payflow-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: SESSION_SECRET
        fromService:
          name: payflow-api
          type: web
          envVarKey: SESSION_SECRET